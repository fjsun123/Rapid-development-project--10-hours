<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>点餐首页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #F59E0B;
            --primary-light: #FEF3C7;
            --primary-dark: #D97706;
            --bg: #F5F5F5;
            --white: #FFFFFF;
            --text: #1F2937;
            --text-secondary: #6B7280;
            --text-light: #9CA3AF;
            --border: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 顶部状态栏占位 */
        .status-bar {
            height: 44px;
            background: var(--white);
        }

        /* 店铺头部 */
        .store-header {
            background: var(--white);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .store-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .store-logo {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .store-details {
            flex: 1;
        }

        .store-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .store-status {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .store-status.open {
            background: #D1FAE5;
            color: #059669;
        }

        .store-status.closed {
            background: #FEE2E2;
            color: #DC2626;
        }

        .store-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .switch-store {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: var(--primary-light);
            color: var(--primary-dark);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-store:active {
            transform: scale(0.95);
            background: var(--primary);
            color: white;
        }

        /* 分类标签 */
        .category-section {
            background: var(--white);
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 0 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg);
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }

        .category-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }

        .category-tab:active {
            transform: scale(0.95);
        }

        /* 菜品列表 */
        .menu-section {
            padding: 12px;
            padding-bottom: 140px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .menu-item {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.3s;
        }

        .menu-item:active {
            transform: scale(0.98);
        }

        .menu-item-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: linear-gradient(135deg, #FED7AA 0%, #FDBA74 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .menu-item-content {
            padding: 10px;
        }

        .menu-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 36px;
        }

        .menu-item-sales {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }

        .menu-item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }

        .menu-item-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--danger);
        }

        .menu-item-price::before {
            content: '¥';
            font-size: 12px;
        }

        .menu-item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qty-btn.minus {
            background: var(--bg);
            color: var(--text-secondary);
        }

        .qty-btn.plus {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3);
        }

        .qty-btn:active {
            transform: scale(0.9);
        }

        .qty-num {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            min-width: 20px;
            text-align: center;
        }

        /* 浮动购物车按钮 */
        .cart-fab {
            position: fixed;
            bottom: 80px;
            right: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: var(--primary);
            color: white;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
            border: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cart-fab:active {
            transform: scale(0.95);
        }

        .cart-fab.hidden {
            transform: translateX(100px);
            opacity: 0;
        }

        .cart-icon-wrapper {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: var(--danger);
            color: white;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: badgePop 0.3s ease;
        }

        @keyframes badgePop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .cart-total {
            font-size: 16px;
            font-weight: 700;
        }

        .cart-total::before {
            content: '¥';
            font-size: 12px;
        }

        /* 购物车抽屉 */
        .cart-drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .cart-drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 320px;
            max-width: 85%;
            background: var(--white);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.active {
            transform: translateX(0);
        }

        .cart-drawer-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-drawer-title {
            font-size: 18px;
            font-weight: 600;
        }

        .cart-clear {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background: #FEE2E2;
            color: var(--danger);
            border-radius: 20px;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cart-clear:active {
            transform: scale(0.95);
        }

        .cart-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .cart-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .cart-empty-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .cart-empty-text {
            font-size: 14px;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: linear-gradient(135deg, #FED7AA 0%, #FDBA74 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cart-item-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .cart-item-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--danger);
        }

        .cart-item-price::before {
            content: '¥';
            font-size: 12px;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-remark {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .cart-remark-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cart-remark-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .cart-remark-input:focus {
            border-color: var(--primary);
        }

        .cart-drawer-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--white);
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cart-summary-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .cart-summary-total {
            font-size: 20px;
            font-weight: 700;
            color: var(--danger);
        }

        .cart-summary-total::before {
            content: '¥';
            font-size: 14px;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .checkout-btn:active {
            transform: scale(0.98);
        }

        .checkout-btn:disabled {
            background: var(--text-light);
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 375px;
            margin: 0 auto;
            background: var(--white);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 500;
        }

        /* 动画效果 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-item {
            animation: fadeInUp 0.4s ease backwards;
        }

        .menu-item:nth-child(1) { animation-delay: 0.05s; }
        .menu-item:nth-child(2) { animation-delay: 0.1s; }
        .menu-item:nth-child(3) { animation-delay: 0.15s; }
        .menu-item:nth-child(4) { animation-delay: 0.2s; }
        .menu-item:nth-child(5) { animation-delay: 0.25s; }
        .menu-item:nth-child(6) { animation-delay: 0.3s; }
        .menu-item:nth-child(7) { animation-delay: 0.35s; }
        .menu-item:nth-child(8) { animation-delay: 0.4s; }

        /* 添加动画 */
        @keyframes addPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .qty-num.pop {
            animation: addPop 0.3s ease;
        }

        /* 飞入购物车动画 */
        .fly-item {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar"></div>

    <!-- 店铺头部 -->
    <div class="store-header">
        <div class="store-info">
            <div class="store-logo">餐</div>
            <div class="store-details">
                <div class="store-name">
                    美味小厨
                    <span class="store-status open">营业中</span>
                </div>
                <div class="store-desc">营业时间: 10:00 - 22:00</div>
            </div>
        </div>
        <button class="switch-store" onclick="switchStore()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 21h5v-5"/>
            </svg>
            切换
        </button>
    </div>

    <!-- 分类标签 -->
    <div class="category-section">
        <div class="category-tabs">
            <button class="category-tab active" data-category="all">全部</button>
            <button class="category-tab" data-category="hot">热销榜</button>
            <button class="category-tab" data-category="staple">主食</button>
            <button class="category-tab" data-category="snack">小食</button>
            <button class="category-tab" data-category="drink">饮品</button>
            <button class="category-tab" data-category="dessert">甜点</button>
            <button class="category-tab" data-category="set">套餐</button>
        </div>
    </div>

    <!-- 菜品列表 -->
    <div class="menu-section">
        <div class="menu-grid" id="menuGrid">
            <!-- 菜品将通过JS动态渲染 -->
        </div>
    </div>

    <!-- 浮动购物车 -->
    <button class="cart-fab hidden" id="cartFab" onclick="openCart()">
        <div class="cart-icon-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"/>
                <circle cx="20" cy="21" r="1"/>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span class="cart-badge" id="cartBadge">0</span>
        </div>
        <span class="cart-total" id="cartTotal">0</span>
    </button>

    <!-- 购物车抽屉遮罩 -->
    <div class="cart-drawer-overlay" id="cartOverlay" onclick="closeCart()"></div>

    <!-- 购物车抽屉 -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-drawer-header">
            <span class="cart-drawer-title">购物车</span>
            <button class="cart-clear" onclick="clearCart()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3,6 5,6 21,6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
                清空
            </button>
        </div>
        <div class="cart-drawer-body" id="cartBody">
            <div class="cart-empty">
                <div class="cart-empty-icon">🛒</div>
                <div class="cart-empty-text">购物车空空如也~</div>
            </div>
        </div>
        <div class="cart-remark">
            <div class="cart-remark-label">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                备注
            </div>
            <textarea class="cart-remark-input" id="remarkInput" placeholder="如需备注请输入，例如：少放辣、多加葱..." rows="2"></textarea>
        </div>
        <div class="cart-drawer-footer">
            <div class="cart-summary">
                <span class="cart-summary-label">合计</span>
                <span class="cart-summary-total" id="summaryTotal">0</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled onclick="checkout()">去结算</button>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                    <path d="M7 2v20"/>
                    <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
            </div>
            <span class="nav-label">点餐</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14,2 14,8 20,8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10,9 9,9 8,9"/>
                </svg>
            </div>
            <span class="nav-label">订单</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <span class="nav-label">我的</span>
        </div>
    </div>

    <script>
        // 菜品数据
        const menuData = [
            { id: 1, name: '招牌红烧肉', price: 38, sales: 1280, emoji: '🥩', category: 'hot' },
            { id: 2, name: '糖醋里脊', price: 32, sales: 956, emoji: '🍖', category: 'hot' },
            { id: 3, name: '蛋炒饭', price: 15, sales: 2341, emoji: '🍚', category: 'staple' },
            { id: 4, name: '牛肉面', price: 28, sales: 1890, emoji: '🍜', category: 'staple' },
            { id: 5, name: '炸鸡翅', price: 18, sales: 1567, emoji: '🍗', category: 'snack' },
            { id: 6, name: '薯条', price: 12, sales: 2103, emoji: '🍟', category: 'snack' },
            { id: 7, name: '冰可乐', price: 8, sales: 3456, emoji: '🥤', category: 'drink' },
            { id: 8, name: '柠檬茶', price: 10, sales: 2890, emoji: '🧋', category: 'drink' },
            { id: 9, name: '提拉米苏', price: 25, sales: 678, emoji: '🍰', category: 'dessert' },
            { id: 10, name: '双拼套餐', price: 45, sales: 890, emoji: '🍱', category: 'set' },
            { id: 11, name: '宫保鸡丁', price: 28, sales: 1123, emoji: '🍛', category: 'hot' },
            { id: 12, name: '酸辣土豆丝', price: 16, sales: 2456, emoji: '🥔', category: 'snack' },
        ];

        // 购物车数据
        let cart = [];
        let currentCategory = 'all';

        // 初始化
        function init() {
            renderMenu();
            bindCategoryEvents();
        }

        // 渲染菜品
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const filteredData = currentCategory === 'all'
                ? menuData
                : menuData.filter(item => item.category === currentCategory);

            grid.innerHTML = filteredData.map(item => {
                const cartItem = cart.find(c => c.id === item.id);
                const qty = cartItem ? cartItem.qty : 0;
                return `
                    <div class="menu-item" data-id="${item.id}">
                        <div class="menu-item-image">${item.emoji}</div>
                        <div class="menu-item-content">
                            <div class="menu-item-name">${item.name}</div>
                            <div class="menu-item-sales">月售 ${item.sales}+</div>
                            <div class="menu-item-footer">
                                <span class="menu-item-price">${item.price}</span>
                                <div class="menu-item-actions">
                                    ${qty > 0 ? `
                                        <button class="qty-btn minus" onclick="updateQty(${item.id}, -1)">−</button>
                                        <span class="qty-num">${qty}</span>
                                    ` : ''}
                                    <button class="qty-btn plus" onclick="updateQty(${item.id}, 1, event)">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 绑定分类事件
        function bindCategoryEvents() {
            const tabs = document.querySelectorAll('.category-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderMenu();
                });
            });
        }

        // 更新数量
        function updateQty(id, delta, event) {
            const item = menuData.find(m => m.id === id);
            const cartItem = cart.find(c => c.id === id);

            if (delta > 0) {
                // 添加动画
                if (event) {
                    createFlyAnimation(event);
                }

                if (cartItem) {
                    cartItem.qty += 1;
                } else {
                    cart.push({ ...item, qty: 1 });
                }
            } else {
                if (cartItem) {
                    cartItem.qty -= 1;
                    if (cartItem.qty <= 0) {
                        cart = cart.filter(c => c.id !== id);
                    }
                }
            }

            updateCart();
            renderMenu();
        }

        // 飞入购物车动画
        function createFlyAnimation(event) {
            const fly = document.createElement('div');
            fly.className = 'fly-item';

            const rect = event.target.getBoundingClientRect();
            fly.style.left = rect.left + 'px';
            fly.style.top = rect.top + 'px';

            document.body.appendChild(fly);

            const cartFab = document.getElementById('cartFab');
            const cartRect = cartFab.getBoundingClientRect();

            fly.animate([
                {
                    left: rect.left + 'px',
                    top: rect.top + 'px',
                    opacity: 1
                },
                {
                    left: cartRect.left + cartRect.width / 2 + 'px',
                    top: cartRect.top + cartRect.height / 2 + 'px',
                    opacity: 0,
                    transform: 'scale(0.3)'
                }
            ], {
                duration: 400,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
            }).onfinish = () => {
                fly.remove();
            };
        }

        // 更新购物车
        function updateCart() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            const cartFab = document.getElementById('cartFab');
            const cartBadge = document.getElementById('cartBadge');
            const cartTotal = document.getElementById('cartTotal');
            const summaryTotal = document.getElementById('summaryTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            // 更新显示值
            cartBadge.textContent = totalQty;
            cartTotal.textContent = totalPrice.toFixed(2);
            summaryTotal.textContent = totalPrice.toFixed(2);

            if (totalQty > 0) {
                cartFab.classList.remove('hidden');
                checkoutBtn.disabled = false;
            } else {
                cartFab.classList.add('hidden');
                checkoutBtn.disabled = true;
            }

            renderCartItems();
        }

        // 渲染购物车项
        function renderCartItems() {
            const cartBody = document.getElementById('cartBody');

            if (cart.length === 0) {
                cartBody.innerHTML = `
                    <div class="cart-empty">
                        <div class="cart-empty-icon">🛒</div>
                        <div class="cart-empty-text">购物车空空如也~</div>
                    </div>
                `;
                return;
            }

            cartBody.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-image">${item.emoji}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-footer">
                            <span class="cart-item-price">${item.price}</span>
                            <div class="cart-item-actions">
                                <button class="qty-btn minus" onclick="updateQty(${item.id}, -1)">−</button>
                                <span class="qty-num">${item.qty}</span>
                                <button class="qty-btn plus" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 打开购物车
        function openCart() {
            document.getElementById('cartOverlay').classList.add('active');
            document.getElementById('cartDrawer').classList.add('active');
        }

        // 关闭购物车
        function closeCart() {
            document.getElementById('cartOverlay').classList.remove('active');
            document.getElementById('cartDrawer').classList.remove('active');
        }

        // 清空购物车
        function clearCart() {
            cart = [];
            updateCart();
            renderMenu();
        }

        // 结算并提交订单到后端
        async function checkout() {
            const remark = document.getElementById('remarkInput').value;
            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

            if (cart.length === 0) {
                alert('购物车是空的');
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:3001/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        customerId: 2,
                        items: cart.map(item => ({ menuItemId: item.id, quantity: item.qty })),
                        notes: remark
                    })
                });

                if (!response.ok) {
                    throw new Error('网络响应失败');
                }

                const result = await response.json();

                if (result.id) {
                    alert('订单提交成功！\n\n订单号: ' + result.orderNo + '\n商品数量: ' + cart.reduce((sum, item) => sum + item.qty, 0) + ' 件\n合计金额: ¥' + total.toFixed(2) + '\n备注: ' + (remark || '无'));
                    cart = [];
                    document.getElementById('remarkInput').value = '';
                    updateCart();
                    renderMenu();
                    closeCart();
                }
            } catch (error) {
                console.error('提交订单失败:', error);
                alert('提交订单失败: ' + error.message + '\n请稍后重试');
            }
        }

        // 切换店铺
        function switchStore() {
            alert('切换店铺功能');
        }

        // 初始化
        init();
    </script>
</body>
</html>
