<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 美食点餐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background-color: #F9FAFB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 375px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 24px;
        }
        .logo-section { text-align: center; margin-bottom: 32px; }
        .logo {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
        }
        .logo svg { width: 48px; height: 48px; fill: white; }
        .welcome-text { font-size: 24px; font-weight: 700; color: #1F2937; margin-bottom: 4px; }
        .welcome-subtitle { font-size: 14px; color: #9CA3AF; }
        .form-section { margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 8px; }
        .phone-input-wrapper { display: flex; gap: 8px; }
        .country-code {
            width: 80px; height: 48px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #374151;
        }
        .input-field {
            flex: 1; height: 48px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 16px;
            color: #1F2937;
            outline: none;
            background: white;
        }
        .input-field:focus { border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
        .input-field.error { border-color: #EF4444; }
        .code-input-wrapper { display: flex; gap: 8px; }
        .code-input { flex: 1; letter-spacing: 4px; text-align: center; }
        .get-code-btn {
            width: 120px; height: 48px;
            border: none;
            border-radius: 12px;
            background: #F59E0B;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .get-code-btn:hover { background: #D97706; }
        .get-code-btn:disabled { background: #E5E7EB; color: #9CA3AF; cursor: not-allowed; }
        .error-message { font-size: 12px; color: #EF4444; margin-top: 6px; display: none; }
        .error-message.show { display: block; }
        .agreement-section { margin-bottom: 24px; }
        .agreement-checkbox { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
        .checkbox-wrapper { position: relative; width: 18px; height: 18px; margin-top: 2px; }
        .checkbox-wrapper input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
        .checkbox-custom {
            width: 18px; height: 18px;
            border: 2px solid #D1D5DB;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            background: white;
            pointer-events: none;
        }
        .checkbox-wrapper input:checked + .checkbox-custom { background: #F59E0B; border-color: #F59E0B; }
        .checkbox-custom svg { width: 12px; height: 12px; fill: white; opacity: 0; }
        .checkbox-wrapper input:checked + .checkbox-custom svg { opacity: 1; }
        .agreement-text { font-size: 12px; color: #6B7280; line-height: 1.5; }
        .agreement-text a { color: #F59E0B; text-decoration: none; }
        .login-btn {
            width: 100%; height: 48px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #F59E0B 0%, #FBBF24 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .login-btn:hover { transform: translateY(-1px); }
        .login-btn:disabled { background: #E5E7EB; color: #9CA3AF; cursor: not-allowed; box-shadow: none; transform: none; }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            color: white;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #10B981; }
        .toast.error { background: #EF4444; }
        .divider { display: flex; align-items: center; margin: 32px 0; }
        .divider-line { flex: 1; height: 1px; background: #E5E7EB; }
        .divider-text { padding: 0 16px; font-size: 12px; color: #9CA3AF; }
        .third-party-section { text-align: center; }
        .third-party-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: 1px solid #E5E7EB;
            background: white;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .third-party-btn:hover { border-color: #07C160; }
        .third-party-btn svg { width: 28px; height: 28px; fill: #07C160; }
        .loading-spinner {
            display: none;
            width: 20px; height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .login-btn.loading .btn-text { display: none; }
        .login-btn.loading .loading-spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>
            </div>
            <h1 class="welcome-text">欢迎回来</h1>
            <p class="welcome-subtitle">登录您的账号继续点餐</p>
        </div>

        <div class="form-section">
            <div class="input-group">
                <label class="input-label">手机号码</label>
                <div class="phone-input-wrapper">
                    <div class="country-code">+86</div>
                    <input type="tel" class="input-field" id="phoneInput" placeholder="请输入手机号码" maxlength="11">
                </div>
                <p class="error-message" id="phoneError">请输入正确的手机号码</p>
            </div>

            <div class="input-group">
                <label class="input-label">验证码</label>
                <div class="code-input-wrapper">
                    <input type="text" class="input-field code-input" id="codeInput" placeholder="请输入验证码" maxlength="6">
                    <button class="get-code-btn" id="getCodeBtn">获取验证码</button>
                </div>
                <p class="error-message" id="codeError">验证码错误，请重新输入</p>
            </div>
        </div>

        <div class="agreement-section">
            <label class="agreement-checkbox">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="agreementCheckbox">
                    <div class="checkbox-custom">
                        <svg viewBox="0 0 12 12"><path d="M10.28 2.28L4 8.56 1.72 6.28A.75.75 0 10.66 7.34l2.5 2.5a.75.75 0 001.06 0l7-7a.75.75 0 00-1.06-1.06z"/></svg>
                    </div>
                </div>
                <span class="agreement-text">我已阅读并同意<a href="#" onclick="event.preventDefault(); showToast('用户协议页面')">《用户协议》</a>和<a href="#" onclick="event.preventDefault(); showToast('隐私政策页面')">《隐私政策》</a></span>
            </label>
        </div>

        <button class="login-btn" id="loginBtn">
            <span class="btn-text">登 录</span>
            <div class="loading-spinner"></div>
        </button>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">其他登录方式</span>
            <div class="divider-line"></div>
        </div>

        <div class="third-party-section">
            <button class="third-party-btn" id="wechatLoginBtn" title="微信登录">
                <svg viewBox="0 0 24 24"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 01.598.082l1.584.926a.272.272 0 00.14.045c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 01-.023-.156.49.49 0 01.201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-7.062-6.122zm-2.036 2.87c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982z"/></svg>
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = 'http://localhost:3001';
        const phoneInput = document.getElementById('phoneInput');
        const codeInput = document.getElementById('codeInput');
        const getCodeBtn = document.getElementById('getCodeBtn');
        const loginBtn = document.getElementById('loginBtn');
        const agreementCheckbox = document.getElementById('agreementCheckbox');
        const phoneError = document.getElementById('phoneError');
        const codeError = document.getElementById('codeError');
        const toast = document.getElementById('toast');

        let countdown = 0;
        let countdownTimer = null;

        function validatePhone(phone) {
            return /^1[3-9]\d{9}$/.test(phone);
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function showError(input, errorElement) {
            input.classList.add('error');
            errorElement.classList.add('show');
        }

        function hideError(input, errorElement) {
            input.classList.remove('error');
            errorElement.classList.remove('show');
        }

        phoneInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            hideError(phoneInput, phoneError);
        });

        codeInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            hideError(codeInput, codeError);
        });

        // 获取验证码
        getCodeBtn.addEventListener('click', async function() {
            const phone = phoneInput.value;
            if (!validatePhone(phone)) {
                showError(phoneInput, phoneError);
                phoneInput.focus();
                return;
            }

            getCodeBtn.disabled = true;
            getCodeBtn.textContent = '发送中...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/sms/code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone }),
                    signal: AbortSignal.timeout ? AbortSignal.timeout(5000) : undefined
                });
                console.log('SMS API response:', res.status);
                const data = await res.json();
                console.log('SMS API data:', data);

                if (data.success) {
                    showToast('验证码已发送', 'success');
                    // 开始倒计时
                    countdown = 60;
                    countdownTimer = setInterval(() => {
                        getCodeBtn.textContent = `${countdown}s后重试`;
                        countdown--;
                        if (countdown < 0) {
                            clearInterval(countdownTimer);
                            getCodeBtn.disabled = false;
                            getCodeBtn.textContent = '获取验证码';
                        }
                    }, 1000);
                } else {
                    showToast(data.error || '发送失败', 'error');
                    getCodeBtn.disabled = false;
                    getCodeBtn.textContent = '获取验证码';
                }
            } catch (e) {
                showToast('网络异常，请稍后重试', 'error');
                getCodeBtn.disabled = false;
                getCodeBtn.textContent = '获取验证码';
            }
        });

        // 登录
        loginBtn.addEventListener('click', async function() {
            const phone = phoneInput.value;
            const code = codeInput.value;

            if (!validatePhone(phone)) {
                showError(phoneInput, phoneError);
                phoneInput.focus();
                return;
            }

            if (code.length !== 4 && code.length !== 6) {
                showError(codeInput, codeError);
                codeInput.focus();
                return;
            }

            if (!agreementCheckbox.checked) {
                showToast('请阅读并同意用户协议和隐私政策', 'error');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, code })
                });
                const data = await res.json();

                if (data.accessToken) {
                    // 保存token
                    localStorage.setItem('token', data.accessToken);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('登录成功！', 'success');

                    // 根据角色跳转
                    setTimeout(() => {
                        if (data.user.role === 'staff') {
                            window.location.href = '商家工作台.html';
                        } else {
                            window.location.href = '客户端点餐首页.html';
                        }
                    }, 1000);
                } else {
                    showToast(data.error || '登录失败', 'error');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            } catch (e) {
                showToast('网络异常，请稍后重试', 'error');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // 微信登录
        document.getElementById('wechatLoginBtn').addEventListener('click', async function() {
            if (!agreementCheckbox.checked) {
                showToast('请阅读并同意用户协议和隐私政策', 'error');
                return;
            }
            showToast('正在跳转微信授权...', 'success');
            // 模拟微信登录成功
            setTimeout(async () => {
                const res = await fetch(`${API_BASE}/api/auth/wechat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: 'mock_wechat_code' })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('微信登录成功！', 'success');
                    setTimeout(() => {
                        window.location.href = '商家工作台.html';
                    }, 1000);
                }
            }, 1000);
        });
    </script>
</body>
</html>
